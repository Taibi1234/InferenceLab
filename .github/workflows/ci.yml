name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Train and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Train model
        run: python scripts/train.py

      - name: Run tests
        run: python -m pytest -q

  docker:
    name: Build and smoke test Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t inferencelab:ci .

      - name: Start container and check health
        run: |
          docker run -d --name inferencelab-ci -p 8000:8000 inferencelab:ci

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 2
          done

          docker logs inferencelab-ci
          exit 1

      - name: Stop test container
        if: always()
        run: docker rm -f inferencelab-ci

      - name: Validate Compose configuration
        run: docker compose config -q